name: CIP icing

on:
  schedule:
    # CIP for hour HH appears on NOMADS at about HH:11. GitHub may start scheduled runs a few minutes late.
    - cron: "25 * * * *"
  workflow_dispatch: {}   # "Run workflow" button for testing

concurrency:
  group: cip
  cancel-in-progress: false

permissions:
  contents: write   # only for the monthly keep-alive commit below

jobs:
  cip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Download and reduce latest CIP
        run: python cip_extract.py --out out

      - name: Upload to web host
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PLAIN: ${{ secrets.FTP_PLAIN }}
        run: python ftp_upload.py out

      # GitHub turns off scheduled workflows in a repository with no commits for 60 days.
      # A tiny commit every 30 days keeps this one running.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u > .keepalive
            git config user.name "cip-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keep schedule alive"
            git push
          fi
